<html>
	<head>
		<style>
			:root {
			--bg: #ffffff;
			--text: #111111;
			--border: #ccc;
			--shape-color: #0091EA;
			--shape-width: 2px;
			
			--shape-color-stock: black;
			
			--top-pallete-height: 12em;
			--left-pallete-width: 15em;
			
			--ppb-top-offset: calc(var(--top-pallete-height) + 4em);
			--ppb-left-offset: calc(var(--left-pallete-height) + 3em);
			
			}
			@media (prefers-color-scheme: dark) {
			  :root {
				--bg: black;
				--text: #e5e5e5;
				--border: #333333;
				--shape-width: 4px;
				
				--shape-color-stock: white;
			  }
			}
		
			body {
			  background-color: var(--bg);
			  color: var(--text);
			  /* background-color: black */
			}
			h1 {
			margin-top: 0;
			}
			
		  .layout {
			margin: 24px auto;
		  }
		
		  .palette {
			position: fixed;
			/* border: 1px solid var(--border); */
			padding: 16px;
			border-radius: 8px;
			background: rgba(255, 255, 255, 0.1);
			/* background-color:black; */
			/* border-radius: 16px; */
			box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
			backdrop-filter: blur(11.9px);
			-webkit-backdrop-filter: blur(11.9px);
			border: 1px solid rgba(255, 255, 255, 0.3);
			z-index: 99
		  }
		  
		  svg polygon, rect, path {
			  stroke: var(--shape-color);
			  stroke-width: var(--shape-width)
		  }
		  
		  polygon[role="stock"] {
			  stroke: var(--shape-color-stock)
		  }
		  
		  .upload-button {
			  display: inline-block;
			  padding: 0.6em 1.2em;
			  background: #0078d4;
			  color: white;
			  border-radius: 8px;
			  cursor: pointer;
			  user-select: none;
			  font-family: sans-serif;
		  }
		  
		  .upload-button:hover { 
			  background: #005ea6;
		  }
		  
		</style>
	</head>
  <body>
	<div class="layout">
	  <div class="palette" style="width:97%">
		  <h1>Patterns</h1>
		  <div style="display: flex;">
			<div class="svg-upload">
				<input type="file" id="svgPieceUpload" accept=".svg,image/svg+xml" multiple hidden/>
				<label class="upload-button" for="svgPieceUpload">
				Add a Pattern (SVG):
				</label>
			</div>
			<piece-quantity-control
			id="triangle-control"
			board="board"
			piece-kind="triangle"
			label="Triangle"
			value="0"
			>
			<svg slot="preview" viewBox="0 0 100 100" width="40" height="40">
				<polygon points="50,18 82,78 18,78" fill="none" data-draggable="true" role="garment"></polygon>
			</svg>
	
			<template slot="shape">
				<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
					<g data-draggable="true">
						<polygon points="0,0 10,20 -10,20" fill="transparent" stroke="red" data-draggable="true" role="garment"></polygon>
					</g>
				</svg>
			</template>
			</piece-quantity-control>
	
			<piece-quantity-control
			id="rect-control"
			board="board"
			piece-kind="rectangle"
			label="Rectangle"
			value="0"
			>
			<svg slot="preview" viewBox="0 0 100 100" width="40" height="40">
				<rect x="20" y="20" width="60" height="60" fill="transparent"></rect>
			</svg>
	
			<template slot="shape">
				<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
				<g>
				<rect data-draggable="true" role="garment" x="0" y="0" width="90" height="60" fill="transparent" ></rect>
				</g>
				</svg>
			</template>
			</piece-quantity-control>
	
			<piece-quantity-control
			id="sleeve-control"
			board="board"
			piece-kind="sleeve-front"
			label="Sleeve Front"
			value="0"
			>
			<svg slot="preview" viewBox="0 0 100 100" width="40" height="40">
				<path d="M20 35 Q35 15 60 22 L75 70 Q45 85 20 60 Z"
					fill="none" ></path>
			</svg>
	
			<template slot="shape">
				<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
				<g  data-draggable="true">
				<polygon points="256.00,0.00 14.00,344.00 0.00,398.00 246.00,573.00 305.00,526.00" data-draggable="true" role="garment" fill="transparent" stroke-width="3"></polygon>
				</g>
				</svg>
			</template>
			</piece-quantity-control>
		  </div>
	  </div>
	  
	  <div style="display:flex;">
		<div class="palette" style="position: fixed; top: var(--ppb-top-offset);width:var(--left-pallete-width)">
			<h1>Garment Stock</h1> 
			<form id="uploadForm">
				<photo-uploader-to-contour-svg target_selector="#board">
					<input type="file" id="photos" name="photos[]" multiple required />
				</photo-uploader-to-contour-svg>
				<button type="submit" id="uploadBtn">Upload</button>
			</form>	
		</div>
		<pattern-pack-board style="position: relative; top: var(--ppb-top-offset);left: 18em;">
			<svg width="2000" height="1000" xmlns="http://www.w3.org/2000/svg" id="board" viewBox="0 0 2000 1000">
				<polygon id="full" points="561.00,90.00 441.00,29.00 350.00,0.00 327.00,15.00 286.00,21.00 235.00,17.00 202.00,2.00 123.00,30.00 0.00,95.00 60.00,202.00 110.00,191.00 111.00,570.00 458.00,566.00 455.00,186.00 505.00,199.00" fill="none" role="stock" stroke="red" />
				<!-- <polygon id="full2" points="561.00,90.00 441.00,29.00 350.00,0.00 327.00,15.00 286.00,21.00 235.00,17.00 202.00,2.00 123.00,30.00 0.00,95.00 60.00,202.00 110.00,191.00 111.00,570.00 458.00,566.00 455.00,186.00 505.00,199.00" fill="none" role="stock" stroke="red" transform="translate(600,0)"/> -->
					
			</svg>
		</pattern-pack-board>
	  </div>
	</div>

	<script type="module">
	  import "/node_modules/packed-patterns-and-stock-html-element/src/PatternPackBoard.js";
	  import "/node_modules/packed-patterns-and-stock-html-element/src/PieceQuantityControl.js";
	  import "/node_modules/photo-uploader-to-contour-svg-html-element/src/PhotoUploaderToContourSVG.js";

	  // const SVG_NS = "http://www.w3.org/2000/svg";
	  // const board = document.getElementById("board");
// 
	  // const stockRect = document.createElementNS(SVG_NS, "rect");
	  // stockRect.setAttribute("x", "20");
	  // stockRect.setAttribute("y", "20");
	  // stockRect.setAttribute("width", "900");
	  // stockRect.setAttribute("height", "700");
	  // stockRect.setAttribute("fill", "none");
	  // stockRect.setAttribute("stroke", "#444");
// 
	  // board.appendChild(stockRect);

	  // board.addEventListener("sync-error", (event) => {
		// console.error("SVG sync failed", event.detail.error);
	  // });
	  
	  const palette = document.querySelector(".palette");
	  const upload = document.getElementById("svgPieceUpload");
	  
	  upload.addEventListener("change", async (event) => {
		for (const file of event.target.files) {
		  const svgText = await file.text();
		  addUploadedSvgPiece(svgText, file.name);
		}
	  
		upload.value = "";
	  });
	  
	  function addUploadedSvgPiece(svgText, filename) {
		const parser = new DOMParser();
		const doc = parser.parseFromString(svgText, "image/svg+xml");
		const uploadedSvg = doc.querySelector("svg");
	  
		if (!uploadedSvg) {
		  console.warn("No SVG found in uploaded file:", filename);
		  return;
		}
	  
		const pieceName = filename.replace(/\.svg$/i, "");
		const pieceKind = pieceName.toLowerCase().replace(/[^a-z0-9]+/g, "-");
	  
		const control = document.createElement("piece-quantity-control");
		control.setAttribute("board", "board");
		control.setAttribute("piece-kind", pieceKind);
		control.setAttribute("label", pieceName);
		control.setAttribute("value", "0");
	  
		// Preview SVG
		const previewSvg = uploadedSvg.cloneNode(true);
		previewSvg.setAttribute("slot", "preview");
		previewSvg.setAttribute("width", "40");
		previewSvg.setAttribute("height", "40");
	  
		// Shape template SVG
		const template = document.createElement("template");
		template.setAttribute("slot", "shape");
	  
		const shapeSvg = uploadedSvg.cloneNode(true);
		shapeSvg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
	  
		prepareSvgForBoard(shapeSvg);
	  
		template.content.appendChild(shapeSvg);
	  
		control.appendChild(previewSvg);
		control.appendChild(template);
	  
		palette.appendChild(control);
	  }
	  
	  function prepareSvgForBoard(svg) {
		const shapes = svg.querySelectorAll("path, polygon, rect, circle, ellipse, polyline");
	  
		for (const shape of shapes) {
		  shape.setAttribute("data-draggable", "true");
		  shape.setAttribute("role", "garment");
	  
		  if (!shape.hasAttribute("fill")) {
			shape.setAttribute("fill", "transparent");
		  }
	  
		  if (!shape.hasAttribute("stroke")) {
			shape.setAttribute("stroke", "red");
		  }
		}
	  
		let wrapper = svg.querySelector("g[data-draggable='true']");
	  
		if (!wrapper) {
		  wrapper = document.createElementNS("http://www.w3.org/2000/svg", "g");
		  wrapper.setAttribute("data-draggable", "true");
	  
		  while (svg.firstChild) {
			wrapper.appendChild(svg.firstChild);
		  }
	  
		  svg.appendChild(wrapper);
		}
	  }
	</script>
  </body>
</html>
