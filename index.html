<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>T-Shirt Recycling Design Tool</title>
    <style>
      :root {
        color-scheme: light;
        --page-bg: #f7f8fa;
        --surface: #ffffff;
        --surface-muted: #eef2f6;
        --text: #18202a;
        --text-muted: #5b6673;
        --border: #cfd8e3;
        --board-bg: #fbfcfe;
        --grid-minor: #dce4ee;
        --grid-major: #b8c6d6;
        --stock-stroke: #1b1f24;
        --garment-stroke: #0077cc;
        --focus: #0077cc;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --page-bg: #101216;
          --surface: #181c22;
          --surface-muted: #202632;
          --text: #eef2f7;
          --text-muted: #a7b0bd;
          --border: #323b48;
          --board-bg: #12161d;
          --grid-minor: #242d39;
          --grid-major: #3b4656;
          --stock-stroke: #f5f7fa;
          --garment-stroke: #55b7ff;
          --focus: #55b7ff;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page-bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        gap: 20px;
        width: min(1440px, calc(100vw - 32px));
        margin: 16px auto;
        align-items: start;
      }

      .sidebar,
      .board-panel {
        display: grid;
        gap: 16px;
      }

      .panel,
      .board-panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      .panel {
        padding: 16px;
      }

      .panel-title {
        margin: 0 0 12px;
        color: var(--text-muted);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .board-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .board-title {
        margin: 0;
        color: var(--text-muted);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .download-button {
        appearance: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-muted);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 650;
        line-height: 1;
        padding: 0.65rem 0.9rem;
      }

      .download-button:hover {
        border-color: var(--focus);
      }

      .board-panel {
        padding: 16px;
        min-width: 0;
      }

      uploadable-palette,
      pattern-pack-board,
      piece-quantity-control {
        color: var(--text);
        color-scheme: light dark;
      }

      pattern-pack-board svg {
        display: block;
        width: 100%;
        height: auto;
        max-height: calc(100vh - 110px);
        overflow: visible;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--board-bg);
      }

      pattern-pack-board .board-background {
        fill: var(--board-bg);
      }

      pattern-pack-board .grid-minor {
        stroke: var(--grid-minor);
        stroke-width: 1;
      }

      pattern-pack-board .grid-major {
        stroke: var(--grid-major);
        stroke-width: 2;
      }

      pattern-pack-board [role="stock"] {
        fill: transparent;
        stroke: var(--stock-stroke);
        stroke-width: 3;
      }

      pattern-pack-board [role="garment"],
      pattern-pack-board [role="garment"] * {
        fill: transparent;
        stroke: var(--garment-stroke);
      }

      pattern-pack-board :focus-visible,
      uploadable-palette :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }

      @media (max-width: 860px) {
        main {
          grid-template-columns: 1fr;
          width: min(100% - 24px, 720px);
          margin: 12px auto;
        }

        pattern-pack-board svg {
          max-height: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <aside class="sidebar" aria-label="Design controls">
        <section class="panel">
          <uploadable-palette
            id="pattern-palette"
            board="board"
            photo-upload-endpoint="/upload.php"
          ></uploadable-palette>
        </section>

        <section class="panel">
          <uploadable-palette
            id="stock-palette"
            board="board"
            photo-upload-endpoint="/upload.php"
          ></uploadable-palette>
        </section>
      </aside>

      <section class="board-panel" aria-labelledby="board-title">
        <div class="board-header">
          <h2 class="board-title" id="board-title">Packboard</h2>
          <button
            class="download-button"
            id="download-board-svg"
            type="button"
          >
            Download SVG
          </button>
        </div>
        <pattern-pack-board>
          <svg
            id="board"
            viewBox="0 0 1200 750"
            aria-label="Draggable garment parts"
            style="touch-action: none;"
            xmlns="http://www.w3.org/2000/svg"
          >
            <defs>
              <pattern id="minor-grid" width="25" height="25" patternUnits="userSpaceOnUse">
                <path class="grid-minor" d="M 25 0 H 0 V 25" fill="none"></path>
              </pattern>
              <pattern id="major-grid" width="100" height="100" patternUnits="userSpaceOnUse">
                <rect width="100" height="100" fill="url(#minor-grid)"></rect>
                <path class="grid-major" d="M 100 0 H 0 V 100" fill="none"></path>
              </pattern>
            </defs>

            <rect class="board-background" x="0" y="0" width="1200" height="750"></rect>
            <rect class="board-grid" x="0" y="0" width="1200" height="750" fill="url(#major-grid)"></rect>

            <polygon
              id="stock-shirt"
              role="stock"
              points="561.00,90.00 441.00,29.00 350.00,0.00 327.00,15.00 286.00,21.00 235.00,17.00 202.00,2.00 123.00,30.00 0.00,95.00 60.00,202.00 110.00,191.00 111.00,570.00 458.00,566.00 455.00,186.00 505.00,199.00"
              transform="translate(68 74)"
            ></polygon>
          </svg>
        </pattern-pack-board>
      </section>
    </main>

    <script type="module">
      import "/node_modules/packed-patterns-and-stock-html-element/src/UploadablePalette.js";
      import "/node_modules/packed-patterns-and-stock-html-element/src/PatternPackBoard.js";

      const patternPalette = document.getElementById("pattern-palette");
      const stockPalette = document.getElementById("stock-palette");
      const downloadBoardSvgButton = document.getElementById("download-board-svg");

      const SVG_NS = "http://www.w3.org/2000/svg";
      const PRINT_STROKE_COLOR = "#000000";
      const SVG_PRESENTATION_PROPERTIES = [
        "color",
        "fill",
        "fill-opacity",
        "opacity",
        "paint-order",
        "stroke",
        "stroke-dasharray",
        "stroke-dashoffset",
        "stroke-linecap",
        "stroke-linejoin",
        "stroke-miterlimit",
        "stroke-opacity",
        "stroke-width",
        "vector-effect",
      ];

      patternPalette.addEventListener("svg-uploaded", (event) => {
        console.log("Uploaded SVG added as", event.detail.controlId);
      });

      patternPalette.addEventListener("svg-upload-error", (event) => {
        console.warn("SVG upload failed", event.detail.failures);
      });

      configureStockPalette(stockPalette);
      downloadBoardSvgButton.addEventListener("click", downloadCurrentBoardSvg);

      function configureStockPalette(palette) {
        const title = palette.shadowRoot.querySelector("h1");
        const uploadButton = palette.shadowRoot.querySelector(".upload-button");

        title.textContent = "Garment Stock";
        uploadButton.textContent = "Add Stock";
        palette.shadowRoot
          .querySelectorAll("piece-quantity-control")
          .forEach((control) => control.remove());

        palette.addEventListener("svg-uploaded", (event) => {
          const control = event.detail.control;
          configureStockControl(control);
          console.log("Uploaded stock added as", control.id);
        });

        palette.addEventListener("svg-upload-error", (event) => {
          console.warn("Stock upload failed", event.detail.failures);
        });
      }

      function configureStockControl(control) {
        const currentId = control.id || control.getAttribute("piece-kind") || "uploaded";
        const currentKind = control.getAttribute("piece-kind") || currentId;
        const currentLabel = control.getAttribute("label") || "Uploaded Stock";

        control.id = currentId.startsWith("stock-") ? currentId : `stock-${currentId}`;
        control.setAttribute(
          "piece-kind",
          currentKind.startsWith("stock-") ? currentKind : `stock-${currentKind}`,
        );

        if (!/^stock\b/i.test(currentLabel)) {
          control.setAttribute("label", `Stock ${currentLabel}`);
        }

        setSvgRole(control, "stock");
        const template = control.querySelector('template[slot="shape"]');

        if (template) {
          setSvgRole(template.content, "stock");
        }
      }

      function setSvgRole(root, role) {
        root
          .querySelectorAll('[role="garment"], [role="stock"], [data-role="garment"], [data-role="stock"]')
          .forEach((element) => {
            if (element.hasAttribute("role")) {
              element.setAttribute("role", role);
            }

            if (element.hasAttribute("data-role")) {
              element.setAttribute("data-role", role);
            }
          });
      }

      function downloadCurrentBoardSvg() {
        const boardSvg = document.getElementById("board");

        if (!(boardSvg instanceof SVGSVGElement)) {
          console.warn("Cannot download packboard SVG because #board is missing.");
          return;
        }

        const svgText = serializeSvgForDownload(boardSvg);
        const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
        const downloadUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = downloadUrl;
        link.download = `packboard-${formatDateForFileName(new Date())}.svg`;
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(downloadUrl), 0);
      }

      function serializeSvgForDownload(sourceSvg) {
        const clonedSvg = sourceSvg.cloneNode(true);

        clonedSvg.setAttribute("xmlns", SVG_NS);
        clonedSvg.setAttribute("version", "1.1");
        setStandaloneSvgSize(clonedSvg);
        inlineComputedSvgStyles(sourceSvg, clonedSvg);
        prepareSvgForPrintImport(clonedSvg);

        return `<?xml version="1.0" encoding="UTF-8"?>\n${new XMLSerializer().serializeToString(clonedSvg)}\n`;
      }

      function prepareSvgForPrintImport(svg) {
        svg
          .querySelectorAll(
            "#minor-grid, #major-grid, .grid-minor, .grid-major, .board-grid, .board-background",
          )
          .forEach((element) => element.remove());

        svg.style.removeProperty("background");
        svg.style.removeProperty("background-color");
        svg.style.removeProperty("border");
        svg.style.removeProperty("border-radius");
        svg.style.removeProperty("touch-action");

        svg
          .querySelectorAll("path, polygon, polyline, line, rect, circle, ellipse")
          .forEach((element) => {
            if (element.closest("defs")) {
              return;
            }

            const stroke = element.getAttribute("stroke") || element.style.stroke;

            if (stroke && stroke !== "none") {
              element.setAttribute("stroke", PRINT_STROKE_COLOR);
              element.style.setProperty("stroke", PRINT_STROKE_COLOR);
            }

            const fill = element.getAttribute("fill") || element.style.fill;

            if (fill === "transparent" || fill === "rgba(0, 0, 0, 0)") {
              element.setAttribute("fill", "none");
              element.style.setProperty("fill", "none");
            }
          });
      }

      function setStandaloneSvgSize(svg) {
        const viewBox = svg.getAttribute("viewBox");
        if (!viewBox) return;

        const dimensions = viewBox.trim().split(/[\s,]+/).map(Number);
        if (dimensions.length < 4) return;

        const width = dimensions[2];
        const height = dimensions[3];

        if (!svg.hasAttribute("width") && Number.isFinite(width) && width > 0) {
          svg.setAttribute("width", String(width));
        }

        if (!svg.hasAttribute("height") && Number.isFinite(height) && height > 0) {
          svg.setAttribute("height", String(height));
        }
      }

      function inlineComputedSvgStyles(sourceRoot, cloneRoot) {
        const sourceElements = [sourceRoot, ...sourceRoot.querySelectorAll("*")];
        const clonedElements = [cloneRoot, ...cloneRoot.querySelectorAll("*")];

        sourceElements.forEach((sourceElement, index) => {
          const clonedElement = clonedElements[index];

          if (!(sourceElement instanceof SVGElement) || !(clonedElement instanceof SVGElement)) {
            return;
          }

          const computedStyle = getComputedStyle(sourceElement);

          SVG_PRESENTATION_PROPERTIES.forEach((property) => {
            const value = computedStyle.getPropertyValue(property);

            if (value) {
              clonedElement.style.setProperty(property, value);
            }
          });
        });
      }

      function formatDateForFileName(date) {
        return date.toISOString().replace(/[:.]/g, "-");
      }
    </script>
  </body>
</html>
